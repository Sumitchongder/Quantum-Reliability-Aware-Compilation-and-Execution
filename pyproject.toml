[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrace"
version = "0.1.0"
description = "Quantum Reliability-Aware Compilation & Execution"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Arpitha Rajeev" },
  { name = "Sumit Tapas Chongder" },
]
dependencies = [
  "qiskit>=2.3",
  "qiskit-ibm-runtime>=0.51",
  "qiskit-aer>=0.17",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qrace*"]